<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market Clock | Fintech Dashboard</title>
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            /* Base Colors - Dark Mode (Default) */
            --bg-body: #0b0c15;
            --bg-card: rgba(22, 24, 39, 0.7);
            --bg-card-hover: rgba(30, 33, 55, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981; /* Market Open */
            --accent-red: #ef4444;   /* Market Closed */
            --glass-blur: 12px;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif; /* For UK/Classic vibes */
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            
            /* Theme Specifics */
            --usa-accent: #2563eb;
            --uk-accent: #c0a062;
            --jp-accent: #ef4444;
            --cn-accent: #dc2626;
            --hk-accent: #d946ef; /* Neon */
            --de-accent: #fbbf24;
            --in-accent: #f97316;
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.8);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --border-color: rgba(0, 0, 0, 0.05);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-green: #059669;
            --accent-red: #dc2626;
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s ease, color 0.3s ease; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            padding-bottom: 4rem;
        }

        /* --- UTILITIES --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .grid { display: grid; gap: 1.5rem; }
        .hidden { display: none !important; }
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.open { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.closed { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.2); }

        /* --- HEADER --- */
        header {
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(11, 12, 21, 0.7); /* Dark bg transparency */
        }
        [data-theme="light"] header { background: rgba(241, 245, 249, 0.8); }

        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo span { color: var(--accent-blue); }
        
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .theme-toggle:hover { background: var(--bg-card-hover); }

        /* --- CONTROLS SECTION --- */
        .controls-area {
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(var(--glass-blur));
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .search-wrapper { position: relative; flex: 1; min-width: 300px; }
        .search-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
        }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        /* --- DASHBOARD GRID --- */
        .markets-grid {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            margin-bottom: 3rem;
        }

        /* --- CARD DESIGN --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            backdrop-filter: blur(var(--glass-blur));
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            height: 220px;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.2);
        }
        [data-theme="light"] .card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .market-info { display: flex; align-items: center; gap: 0.75rem; }
        .flag { font-size: 1.8rem; line-height: 1; }
        .names h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
        .names p { font-size: 0.8rem; color: var(--text-secondary); }

        .remove-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 1.2rem; opacity: 0; transition: opacity 0.2s;
        }
        .card:hover .remove-btn { opacity: 1; }

        .time-display {
            margin-top: auto;
            position: relative;
        }

        .clock-time {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text-primary);
            line-height: 1;
        }

        .clock-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* --- CULTURAL STYLING OVERRIDES --- */
        
        /* USA */
        .card.theme-usa { border-top: 4px solid var(--usa-accent); }
        .card.theme-usa .clock-time { font-weight: 800; letter-spacing: -2px; } /* Bold typography */

        /* UK */
        .card.theme-uk { border-top: 4px solid var(--uk-accent); }
        .card.theme-uk .names h3 { font-family: var(--font-serif); font-style: italic; } /* Elegant serif */

        /* Japan */
        .card.theme-jp { border-top: 4px solid var(--jp-accent); }
        .card.theme-jp { text-align: center; justify-content: center; }
        .card.theme-jp .clock-time { letter-spacing: 2px; } /* Minimalist spacing */
        
        /* China */
        .card.theme-cn { border-top: 4px solid var(--cn-accent); }
        .card.theme-cn .clock-time { color: #fca5a5; } /* Reddish tint */

        /* Hong Kong */
        .card.theme-hk { border-top: 4px solid var(--hk-accent); }
        .card.theme-hk { box-shadow: 0 4px 15px rgba(217, 70, 239, 0.15); } /* Neon glow */
        
        /* Germany */
        .card.theme-de { border-top: 4px solid var(--de-accent); }
        .card.theme-de .clock-time { font-family: 'Arial Black', sans-serif; } /* Structured/Industrial */

        /* India */
        .card.theme-in { border-top: 4px solid var(--in-accent); }
        .card.theme-in::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:4px;
            background: linear-gradient(90deg, #f97316, #fbbf24, #10b981); opacity: 0.5;
        } /* Saffron/Green hints */

        /* --- DROPDOWN RESULTS --- */
        #dropdown-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 5px;
            z-index: 100;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .dropdown-item:hover { background: var(--bg-card-hover); }
        .dropdown-item small { color: var(--text-secondary); margin-left: auto; }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            .controls-area { flex-direction: column; align-items: stretch; }
            .clock-time { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="flex justify-between items-center">
            <div class="logo">MARKET<span>CLOCK</span></div>
            <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme">
                <span id="themeIcon">☀</span> <span>Mode</span>
            </button>
        </header>

        <main>
            <!-- Main Grid: Top 7 Markets -->
            <h2 style="margin-bottom: 1.5rem; font-weight: 500;">Global Market Hubs</h2>
            <section class="grid markets-grid" id="primary-markets">
                <!-- Cards will be injected here via JS -->
            </section>

            <!-- Controls & Added Markets -->
            <div class="controls-area">
                <div>
                    <h3 style="margin-bottom: 0.5rem;">Add New Zone</h3>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Track additional exchanges or financial centers.</p>
                </div>
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="zoneSearch" placeholder="Search (e.g., Sydney, Dubai)...">
                    <div id="dropdown-results" class="hidden"></div>
                </div>
            </div>

            <div id="added-markets-label" class="hidden">
                <h2 style="margin-bottom: 1.5rem; font-weight: 500; color: var(--text-secondary); font-size: 1.2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Your Custom Zones</h2>
            </div>
            
            <section class="grid markets-grid" id="secondary-markets">
                <!-- User added cards will appear here -->
            </section>
        </main>

        <footer style="margin-top: 4rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
            <p>&copy; 2023 MarketClock Dashboard. All times are local to the respective exchange.</p>
        </footer>
    </div>

    <script>
        // --- DATA & CONFIGURATION ---

        // Timezone data database (Expanded for search)
        const TZ_DATABASE = [
            { id: 'us', city: 'New York', country: 'USA', region: 'America/New_York', exchanges: ['NYSE', 'NASDAQ'], theme: 'theme-usa', flag: '🇺🇸', hours: {open: 9.5, close: 16} }, // 9:30 AM - 4:00 PM
            { id: 'uk', city: 'London', country: 'UK', region: 'Europe/London', exchanges: ['LSE'], theme: 'theme-uk', flag: '🇬🇧', hours: {open: 8, close: 16.5} }, // 8:00 AM - 4:30 PM
            { id: 'jp', city: 'Tokyo', country: 'Japan', region: 'Asia/Tokyo', exchanges: ['TSE'], theme: 'theme-jp', flag: '🇯🇵', hours: {open: 9, close: 15} },
            { id: 'cn', city: 'Shanghai', country: 'China', region: 'Asia/Shanghai', exchanges: ['SSE'], theme: 'theme-cn', flag: '🇨🇳', hours: {open: 9.5, close: 15} },
            { id: 'hk', city: 'Hong Kong', country: 'Hong Kong', region: 'Asia/Hong_Kong', exchanges: ['HKEX'], theme: 'theme-hk', flag: '🇭🇰', hours: {open: 9.5, close: 16} },
            { id: 'de', city: 'Frankfurt', country: 'Germany', region: 'Europe/Berlin', exchanges: ['Xetra'], theme: 'theme-de', flag: '🇩🇪', hours: {open: 9, close: 17.5} }, // 9:00 AM - 5:30 PM
            { id: 'in', city: 'Mumbai', country: 'India', region: 'Asia/Kolkata', exchanges: ['NSE', 'BSE'], theme: 'theme-in', flag: '🇮🇳', hours: {open: 9, close: 15.5} },
            // Additional searchable zones
            { id: 'au', city: 'Sydney', country: 'Australia', region: 'Australia/Sydney', exchanges: ['ASX'], theme: 'theme-usa', flag: '🇦🇺', hours: {open: 10, close: 16} },
            { id: 'ca', city: 'Toronto', country: 'Canada', region: 'America/Toronto', exchanges: ['TSX'], theme: 'theme-usa', flag: '🇨🇦', hours: {open: 9.5, close: 16} },
            { id: 'sg', city: 'Singapore', country: 'Singapore', region: 'Asia/Singapore', exchanges: ['SGX'], theme: 'theme-usa', flag: '🇸🇬', hours: {open: 9, close: 17} },
            { id: 'ae', city: 'Dubai', country: 'UAE', region: 'Asia/Dubai', exchanges: ['DFM'], theme: 'theme-usa', flag: '🇦🇪', hours: {open: 10, close: 14} },
            { id: 'fr', city: 'Paris', country: 'France', region: 'Europe/Paris', exchanges: ['Euronext'], theme: 'theme-uk', flag: '🇫🇷', hours: {open: 9, close: 17.5} },
            { id: 'ch', city: 'Zurich', country: 'Switzerland', region: 'Europe/Zurich', exchanges: ['SIX'], theme: 'theme-de', flag: '🇨🇭', hours: {open: 9, close: 17.5} }
        ];

        // Default primary IDs
        const PRIMARY_IDS = ['us', 'uk', 'jp', 'cn', 'hk', 'de', 'in'];

        // State
        let state = {
            addedZones: [], // Array of IDs
            theme: 'dark'
        };

        // --- DOM ELEMENTS ---
        const primaryContainer = document.getElementById('primary-markets');
        const secondaryContainer = document.getElementById('secondary-markets');
        const searchInput = document.getElementById('zoneSearch');
        const dropdownResults = document.getElementById('dropdown-results');
        const addedLabel = document.getElementById('added-markets-label');
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');

        // --- INITIALIZATION ---
        function init() {
            // Render Primary Cards
            PRIMARY_IDS.forEach(id => {
                const data = TZ_DATABASE.find(t => t.id === id);
                if(data) createCard(data, primaryContainer);
            });
            
            // Start Global Clock
            setInterval(updateTimes, 1000);
            updateTimes(); // Initial call

            // Event Listeners
            setupTheme();
            setupSearch();
        }

        // --- CORE LOGIC: TIME & MARKET STATUS ---

        function updateTimes() {
            const now = new Date();

            // Update all cards present in DOM
            document.querySelectorAll('.card').forEach(card => {
                const region = card.dataset.region;
                const openHour = parseFloat(card.dataset.open);
                const closeHour = parseFloat(card.dataset.close);
                
                // Get Time in Target Region
                const timeString = now.toLocaleTimeString('en-US', { 
                    timeZone: region, 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
                
                // Get Date/Day in Target Region (needed for market status logic)
                // We create a date object object representing the target time
                // Note: toLocaleString returns a string, we parse parts carefully or just compare hours
                // A robust way to get the hour in the target zone:
                const targetTimeStr = now.toLocaleString('en-US', { timeZone: region });
                const targetDate = new Date(targetTimeStr);
                const currentHour = targetDate.getHours() + (targetDate.getMinutes() / 60);

                // Update DOM
                card.querySelector('.clock-time').textContent = timeString;
                card.querySelector('.timezone-abbr').textContent = getTimeZoneAbbr(region, now);

                // Market Status
                const statusEl = card.querySelector('.market-status');
                const nextEventEl = card.querySelector('.next-event');

                const isOpen = isMarketOpen(currentHour, openHour, closeHour);
                
                if (isOpen) {
                    statusEl.textContent = 'Market Open';
                    statusEl.className = 'badge open';
                    nextEventEl.textContent = `Closes in ${formatDuration(closeHour - currentHour)}`;
                } else {
                    statusEl.textContent = 'Market Closed';
                    statusEl.className = 'badge closed';
                    
                    // Time to next open
                    let timeToOpen = openHour - currentHour;
                    if (timeToOpen < 0) timeToOpen += 24; // Next day
                    nextEventEl.textContent = `Opens in ${formatDuration(timeToOpen)}`;
                }
            });
        }

        function isMarketOpen(current, open, close) {
            return current >= open && current < close;
        }

        function formatDuration(decimalHours) {
            const h = Math.floor(decimalHours);
            const m = Math.floor((decimalHours - h) * 60);
            return `${h}h ${m}m`;
        }

        function getTimeZoneAbbr(timeZone, date) {
            // Fallback for browsers that might not support 'timeZoneName'
            try {
                return date.toLocaleTimeString('en-US', { timeZone: timeZone, timeZoneName: 'short' }).split(' ')[2];
            } catch (e) {
                return 'UTC';
            }
        }

        // --- CARD COMPONENT GENERATION ---

        function createCard(data, container) {
            const card = document.createElement('div');
            card.className = `card ${data.theme}`;
            card.dataset.region = data.region;
            card.dataset.open = data.hours.open;
            card.dataset.close = data.hours.close;

            // Inner HTML structure
            card.innerHTML = `
                <div class="card-header">
                    <div class="market-info">
                        <div class="flag">${data.flag}</div>
                        <div class="names">
                            <h3>${data.city}</h3>
                            <p>${data.exchanges.join(', ')}</p>
                        </div>
                    </div>
                    ${container.id === 'secondary-markets' ? `<button class="remove-btn" onclick="removeCard(this)" title="Remove Zone">&times;</button>` : ''}
                </div>
                
                <div class="time-display">
                    <div class="clock-time">--:--:--</div>
                    <div class="clock-meta">
                        <span class="timezone-abbr">---</span>
                        <span class="badge market-status">--</span>
                    </div>
                    <div class="clock-meta" style="margin-top:4px;">
                         <span class="next-event">...</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        // --- INTERACTION LOGIC ---

        function setupTheme() {
            themeBtn.addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.body.setAttribute('data-theme', state.theme);
                themeIcon.textContent = state.theme === 'dark' ? '☀' : '☾';
            });
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                dropdownResults.innerHTML = '';
                
                if (val.length < 1) {
                    dropdownResults.classList.add('hidden');
                    return;
                }

                // Filter DB: Not already in Primary OR Added
                const currentIds = [...PRIMARY_IDS, ...state.addedZones];
                const matches = TZ_DATABASE.filter(tz => 
                    (tz.city.toLowerCase().includes(val) || tz.country.toLowerCase().includes(val)) &&
                    !currentIds.includes(tz.id)
                );

                if (matches.length > 0) {
                    dropdownResults.classList.remove('hidden');
                    matches.forEach(match => {
                        const div = document.createElement('div');
                        div.className = 'dropdown-item';
                        div.innerHTML = `
                            <span style="font-size:1.2rem">${match.flag}</span>
                            <div>
                                <div><strong>${match.city}</strong>, ${match.country}</div>
                                <small>${match.exchanges[0]}</small>
                            </div>
                            <small>${match.region}</small>
                        `;
                        div.addEventListener('click', () => {
                            addZone(match);
                            dropdownResults.classList.add('hidden');
                            searchInput.value = '';
                        });
                        dropdownResults.appendChild(div);
                    });
                } else {
                    dropdownResults.classList.add('hidden');
                }
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrapper')) {
                    dropdownResults.classList.add('hidden');
                }
            });
        }

        function addZone(data) {
            state.addedZones.push(data.id);
            createCard(data, secondaryContainer);
            addedLabel.classList.remove('hidden');
            updateTimes(); // Immediate update
        }

        // Exposed to global scope for the inline onclick handler
        window.removeCard = function(btn) {
            const card = btn.closest('.card');
            // Ideally we map the card back to ID, but for visual removal:
            card.style.opacity = '0';
            card.style.transform = 'scale(0.9)';
            setTimeout(() => {
                card.remove();
                if (secondaryContainer.children.length === 0) {
                    addedLabel.classList.add('hidden');
                }
            }, 300);
        };

        // Run
        init();

    </script>
</body>
</html>
